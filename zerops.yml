# Wayfinder — Zerops build & run recipes.
#
# This file defines HOW each service is built and run. The actual infrastructure
# (service hostnames, types, secrets, public subdomains) is defined in
# `zerops-project-import.yaml` (or the Zerops dashboard). Each `setup` name below
# must match the `zeropsSetup` value in the import file.
#
# Architecture on Zerops:
#   frontend  -> Next.js 16 SSR (standalone build), public HTTPS subdomain
#   api       -> Express API, public HTTPS subdomain, does NOT spawn workers
#   worker    -> Python service that polls MongoDB for queued jobs and runs the
#                analysis pipeline (external-worker mode)
#   redis     -> managed Valkey (Redis-compatible), injected as env refs below
#   MongoDB   -> NOT offered on Zerops; use MongoDB Atlas, URL passed as secret
zerops:
  # ---------------------------------------------------------------------------
  # Next.js frontend (SSR, standalone output)
  # ---------------------------------------------------------------------------
  - setup: frontend
    build:
      base: nodejs@22
      envVariables:
        # NEXT_PUBLIC_API_URL must be set as a secret variable named exactly
        # "NEXT_PUBLIC_API_URL" (no prefix) on the frontend service in the
        # Zerops dashboard. Zerops automatically exposes it to THIS build
        # container as RUNTIME_NEXT_PUBLIC_API_URL — this line maps it to the
        # name Next.js actually needs at build time.
        NEXT_PUBLIC_API_URL: ${RUNTIME_NEXT_PUBLIC_API_URL}
      buildCommands:
        - cd frontend && npm ci && npm run build
        # Assemble the standalone runtime layout (same shape as the official
        # Next.js standalone Docker image) so one deployFiles entry covers it.
        - mkdir -p ./app
        - cp -r frontend/.next/standalone/. ./app/
        - mkdir -p ./app/.next
        - cp -r frontend/.next/static ./app/.next/static
        - cp -r frontend/public ./app/public
      deployFiles:
        - app/~
      cache:
        - frontend/node_modules

    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /

    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node server.js

  # ---------------------------------------------------------------------------
  # Express API (queue + report service)
  # ---------------------------------------------------------------------------
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - npm --prefix api ci --omit=dev
      deployFiles:
        - api/src
        - api/package.json
        - api/node_modules
      cache:
        - api/node_modules

    deploy:
      readinessCheck:
        httpGet:
          port: 4000
          path: /health

    run:
      base: nodejs@22
      ports:
        - port: 4000
          httpSupport: true
      envVariables:
        # VALKEY_EXTERNAL_WORKER=true makes the API queue jobs in MongoDB and
        # let the separate `worker` service run them.
        WAYFINDER_EXTERNAL_WORKER: "true"
        WAYFINDER_REDIS_HOST: ${redis_hostname}
        WAYFINDER_REDIS_PORT: ${redis_port}
        WAYFINDER_REDIS_PASSWORD: ${redis_password}
      start: node api/src/server.js

  # ---------------------------------------------------------------------------
  # Python analysis worker (polls MongoDB for queued jobs)
  # ---------------------------------------------------------------------------
  - setup: worker
    build:
      base: python@3.12
      deployFiles:
        - worker/analyzer.py
        - worker/ai_rank.py
        - worker/db.py
        - worker/envutil.py
        - worker/metrics.py
        - worker/poller.py
        - worker/requirements.txt
      addToRunPrepare:
        - worker/requirements.txt
      cache:
        - worker/__pycache__

    run:
      base: python@3.12
      prepareCommands:
        - python3 -m pip install --ignore-installed -r worker/requirements.txt
      envVariables:
        WAYFINDER_REDIS_HOST: ${redis_hostname}
        WAYFINDER_REDIS_PORT: ${redis_port}
        WAYFINDER_REDIS_PASSWORD: ${redis_password}
      start: python3 worker/poller.py
